name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: python -m pip install -r scripts/requirements.txt
      - name: Python regression suite (synthetic data only)
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover scripts/tests -v

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select an installed iPhone simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          phone = next(d for runtime, group in devices['devices'].items() if 'iOS' in runtime
                       for d in group if d['name'].startswith('iPhone'))
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"SIMULATOR_ID={phone['udid']}\n")
          PY
      - name: Swift unit tests and landscape UI regression
        run: |
          xcodebuild test -project NystagmuSense.xcodeproj -scheme NystagmuSense \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO \
            -only-testing:NystagmuSenseTests \
            -only-testing:NystagmuSenseUITests/NystagmuSenseUITests/testRecordingRequiresLandscape \
            -resultBundlePath TestResults.xcresult
      - name: Upload Xcode test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: TestResults.xcresult
